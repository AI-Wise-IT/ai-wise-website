<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI Wise is the independent AI engineering practice of Simon van Meegdenburg. Website coming soon.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <title>AI Wise | Website Coming Soon</title>
    <style>
      :root {
        --bg: #f2efe6;
        --ink: #24302e;
        --muted: #5d6761;
        --green: #58766a;
        --burgundy: #7b3540;
        --cream: #fffaf0;
        --line: #d8d0bf;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        letter-spacing: 0;
        background:
          linear-gradient(90deg, var(--green) 0 16px, var(--burgundy) 16px 24px, transparent 24px),
          var(--bg);
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
        align-items: center;
        gap: clamp(2rem, 6vw, 6rem);
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: clamp(3rem, 8vh, 7rem) 0;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--green);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        color: var(--ink);
        font-size: clamp(3.25rem, 9vw, 7.4rem);
        line-height: 0.92;
        font-weight: 800;
        letter-spacing: 0;
      }

      .soon {
        display: block;
        color: var(--burgundy);
      }

      .intro {
        max-width: 680px;
        margin: 2rem 0 0;
        color: var(--muted);
        font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      }

      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 2.25rem;
        color: var(--burgundy);
        font-size: 1rem;
        font-weight: 700;
      }

      a {
        color: inherit;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.22em;
      }

      .portrait-wrap {
        position: relative;
        align-self: stretch;
        min-height: 560px;
        border-left: 1px solid var(--line);
        padding-left: clamp(1.5rem, 4vw, 3rem);
      }

      .portrait {
        width: 100%;
        height: 100%;
        min-height: 560px;
        object-fit: cover;
        object-position: 50% 38%;
        border-radius: 8px;
        display: block;
        box-shadow: 0 28px 70px rgba(36, 48, 46, 0.15);
      }

      .caption {
        position: absolute;
        right: 1.25rem;
        bottom: 1.25rem;
        margin: 0;
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 250, 240, 0.9);
        font-size: 0.9rem;
        font-weight: 700;
      }

      @media (max-width: 820px) {
        body {
          background:
            linear-gradient(180deg, var(--green) 0 16px, var(--burgundy) 16px 24px, transparent 24px),
            var(--bg);
        }

        main {
          min-height: auto;
          grid-template-columns: 1fr;
          width: min(100% - 36px, 620px);
          gap: 2.5rem;
          padding: 4.5rem 0 2rem;
        }

        .intro {
          margin-top: 1.5rem;
        }

        .contact {
          margin-top: 1.75rem;
        }

        .portrait-wrap {
          min-height: auto;
          border-left: 0;
          padding-left: 0;
        }

        .portrait {
          aspect-ratio: 4 / 5;
          min-height: 0;
          max-height: 620px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <p class="eyebrow">AI Wise</p>
        <h1 id="page-title">Website <span class="soon">coming soon</span></h1>
        <p class="intro">
          AI Wise is the independent AI engineering practice of Simon van Meegdenburg.
          This website is being prepared.
        </p>
        <div class="contact" aria-label="Contact details">
          <a href="mailto:simon@aiwise.it.com">simon@aiwise.it.com</a>
          <a href="tel:+31613926494">+31 6 13926494</a>
        </div>
      </section>
      <figure class="portrait-wrap">
        <img class="portrait" src="assets/profile-picture-professional.jpg" alt="Simon van Meegdenburg">
        <figcaption class="caption">Simon van Meegdenburg</figcaption>
      </figure>
    </main>
  </body>
</html>
